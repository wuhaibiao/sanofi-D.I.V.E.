[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memsys"
version = "0.1.0"
description = "Qdrant-backed memory layer for multi-user AI agents"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
strict = ["tokenizers>=0.20,<1"]
fast = ["numpy>=1.26,<3"]
rerank = [
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "transformers==4.51.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torch>=2.5,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "transformers>=4.57,<5; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "sentencepiece>=0.2,<1",
]

[project.scripts]
memsys = "memsys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memsys = ["web/*.html", "web/*.css", "web/*.js"]
